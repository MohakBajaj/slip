name: Release

# Pushing a v* tag publishes a GitHub Release. workflow_dispatch and pull
# requests run the same package, sign, checksum, and manifest steps and upload
# artifacts instead of publishing. Publishing uses the built-in GITHUB_TOKEN.
on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-tag.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Check
        run: bun run check
      - name: Test
        run: bun test src/shared src/vault.test.ts src/main/pasteboard.test.ts
      - name: Package, sign, and write the manifest
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: bash scripts/package-mac.sh
      - name: Upload dry-run artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: slip-mac-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest.json
            dist/SHA256SUMS
            dist/release-notes.md
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release create "$tag" \
            --title "Slip ${version}" \
            --notes-file dist/release-notes.md \
            "dist/Slip-${version}.dmg" \
            "dist/Slip-${version}-arm64-mac.zip" \
            dist/latest.json \
            dist/SHA256SUMS
