name: site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
