appId: dev.mohak.slip
productName: Slip
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!resources/dock/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - "**/*.node"
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/**"
extraResources:
  - from: resources/tray
    to: tray
  - from: resources/dock
    to: dock
electronLanguages:
  - en
win:
  executableName: slip
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAutoFillHeuristicControllerEnabled: false
    NSDocumentsFolderUsageDescription: Slip keeps your notes as markdown in Documents.
    NSMicrophoneUsageDescription: Slip records a voice note when you capture by speaking.
  notarize: false
  extraFiles:
    - from: dist/cli/slip
      to: Helpers/slip
dmg:
  artifactName: Slip-${version}.${ext}
  background: build/background.tiff
  icon: build/icon.icns
  iconSize: 80
  iconTextSize: 12
  title: Slip
  window:
    x: 280
    y: 160
    width: 660
    height: 400
  contents:
    - x: 168
      y: 188
      type: file
    - x: 492
      y: 188
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
